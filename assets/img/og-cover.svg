<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="0.25" y2="1">
      <stop offset="0%" stop-color="#16203D"/>
      <stop offset="46%" stop-color="#0D1326"/>
      <stop offset="100%" stop-color="#090C18"/>
    </linearGradient>
    <radialGradient id="key" cx="6%" cy="-14%" r="85%">
      <stop offset="0%" stop-color="#C4F0EC" stop-opacity="0.34"/>
      <stop offset="62%" stop-color="#C4F0EC" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pane" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.15"/>
      <stop offset="45%" stop-color="#FFFFFF" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.03"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#room)"/>
  <rect width="1200" height="630" fill="url(#key)"/>

  <rect x="72" y="88" width="1056" height="454" rx="36" fill="url(#pane)" stroke="#FFFFFF" stroke-opacity="0.13"/>

  <g font-family="Sora, ui-sans-serif, system-ui, sans-serif">
    <text x="128" y="268" fill="#F2F7FF" font-size="76" font-weight="500" letter-spacing="-1.5">Tanishq Tiwari</text>
    <text x="128" y="326" fill="#7FE3D4" font-size="30" font-weight="400" letter-spacing="0.5">Software Development Engineer</text>
    <text x="128" y="410" fill="#CDDBF0" fill-opacity="0.62" font-size="24" font-weight="300">Payment workflows, backend services, and distributed systems</text>
    <text x="128" y="446" fill="#CDDBF0" fill-opacity="0.62" font-size="24" font-weight="300">built with Go, Java, Kafka, Redis, and AWS.</text>
